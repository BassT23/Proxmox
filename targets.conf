# Optional inventory for external Linux targets.
#
# This file is intentionally not required for the existing Proxmox workflow.
# Add one section per target.  Keep only reachability information here;
# operating system, distribution and package manager are detected over SSH.
#
# Example:
# [raspi]
# host=192.168.10.50
# transport=ssh
# user=basst
# port=22

# External SSH targets currently support Debian, Ubuntu and Raspberry Pi OS
# style apt-based systems, plus Rocky/RHEL/AlmaLinux/Fedora dnf systems when
# identified unambiguously from /etc/os-release. Use SSH keys and root or
# passwordless sudo.
